<!doctype html>
<!-- Social preview template. Rendered to assets/img/og-*.png by tools/render-images.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #15171C; }
  .card {
    position: relative; width: 1200px; height: 630px; box-sizing: border-box;
    color: #F4F1EC; font-family: Inter, sans-serif;
    display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 56px 1fr 56px;
    border: 1px solid rgba(244,241,236,.12);
  }
  .hud { font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #8A8E98; }
  .top, .bottom { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 0 44px; }
  .top { border-bottom: 1px solid rgba(244,241,236,.12); }
  .bottom { border-top: 1px solid rgba(244,241,236,.12); }
  .top .n { color: var(--accent); }
  .main { padding: 56px 44px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .name { font-family: 'Space Grotesk', sans-serif; font-size: 96px; line-height: .95; letter-spacing: -4px; }
  .name .p { font-weight: 500; } .name .f { font-weight: 700; color: var(--accent); }
  .name .s { font-weight: 400; color: #A3A7B0; }
  .line { font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 500; letter-spacing: -1px; line-height: 1.15; color: #A3A7B0; max-width: 700px; }
  .line b { color: #F4F1EC; font-weight: 500; }
  .art {
    border-left: 1px solid rgba(244,241,236,.12); position: relative; display: grid; place-items: center;
    background-color: #101216;
    background-image: linear-gradient(rgba(244,241,236,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(244,241,236,.12) 1px, transparent 1px);
    background-size: 32px 32px; background-position: center;
  }
  .art::before, .art::after { content: ""; position: absolute; background: var(--accent); opacity: .45; }
  .art::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .art::after { top: 50%; left: 0; right: 0; height: 1px; }
  .art svg { width: 176px; height: 176px; position: relative; }
  .cta { background: #F2752B; color: #15171C; padding: 8px 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top hud"><span id="label"></span><span>Open Forge Studio</span></div>
  <div class="main"><div class="name" id="name"></div><div class="line" id="line"></div></div>
  <div class="art" id="art"></div>
  <div class="bottom hud"><span id="meta"></span><span class="cta">Custom versions available</span></div>
</div>
<script>
  var spark = '<path d="M51 7C51.5 10.5 53.5 12.5 57 13 53.5 13.5 51.5 15.5 51 19 50.5 15.5 48.5 13.5 45 13 48.5 12.5 50.5 10.5 51 7Z" fill="#F2752B"/>';
  var variants = {
    default: {
      accent: "#F2752B",
      label: '<span class="n">■</span> Independent software studio',
      tile: '<rect width="64" height="64" rx="15" fill="#22252D"/><rect x="17" y="14" width="10" height="36" rx="2" fill="#F4F1EC"/><rect x="17" y="14" width="26" height="9" rx="2" fill="#F4F1EC"/><rect x="17" y="30" width="19" height="8" rx="2" fill="#F4F1EC"/><path d="M50 9C50.6 13.2 52.8 15.4 57 16 52.8 16.6 50.6 18.8 50 23 49.4 18.8 47.2 16.6 43 16 47.2 15.4 49.4 13.2 50 9Z" fill="#F2752B"/>',
      name: '<span class="f" style="color:#F4F1EC">Open Forge</span><br><span class="s">Studio</span>',
      line: '<b>Practical software, forged to fit.</b> Desktop apps for monitoring, security and productivity.',
      meta: 'ThermoForge · VaultForge'
    },
    thermoforge: {
      accent: "#E8463A",
      label: '<span class="n">01</span> / Monitoring · Security',
      tile: '<rect width="64" height="64" rx="15" fill="#22252D"/><g transform="translate(14 14) scale(1.5)" fill="none" stroke="#E8463A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4a2 2 0 0 1 4 0v10.5a4 4 0 1 1-4 0Z"/><path d="M12 9v8"/><path d="M17 6h3M17 9.5h2"/></g>' + spark,
      name: '<span class="p">Thermo</span><span class="f">Forge</span>',
      line: '<b>PC temperatures &amp; suspicious-process monitor</b> for Windows.',
      meta: 'Windows 10 / 11 · .NET 10'
    },
    vaultforge: {
      accent: "#3D8BFF",
      label: '<span class="n">02</span> / Security · Passwords',
      tile: '<rect width="64" height="64" rx="15" fill="#22252D"/><g transform="translate(14 14) scale(1.5)" fill="none" stroke="#3D8BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><circle cx="12" cy="10.5" r="1.8"/><path d="M12 12.3V15.5"/></g>' + spark,
      name: '<span class="p">Vault</span><span class="f">Forge</span>',
      line: '<b>Password manager.</b>',
      meta: 'by Open Forge Studio'
    }
  };
  var v = variants[location.hash.slice(1)] || variants.default;
  document.getElementById("card").style.setProperty("--accent", v.accent);
  document.getElementById("label").innerHTML = v.label;
  document.getElementById("name").innerHTML = v.name;
  document.getElementById("line").innerHTML = v.line;
  document.getElementById("meta").innerHTML = v.meta;
  document.getElementById("art").innerHTML = '<svg viewBox="0 0 64 64">' + v.tile + '</svg>';
</script>
</body>
</html>
